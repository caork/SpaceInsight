name: GPUI Desktop and Terminal

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os_name }} (${{ matrix.arch_label }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: linux
            runs_on: ubuntu-22.04
            arch_label: x86_64
            exe_suffix: ""
          - os_name: linux
            runs_on: ubuntu-22.04-arm
            arch_label: aarch64
            exe_suffix: ""
          - os_name: windows
            runs_on: windows-latest
            arch_label: x86_64
            exe_suffix: .exe
          - os_name: windows
            runs_on: windows-11-arm
            arch_label: aarch64
            exe_suffix: .exe
          - os_name: macos
            runs_on: macos-15-intel
            arch_label: x86_64
            exe_suffix: ""
          - os_name: macos
            runs_on: macos-15
            arch_label: aarch64
            exe_suffix: ""
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          
      - name: Install Linux dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev
          
      - name: Install Metal compiler
        if: matrix.os_name == 'macos'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build Release (Linux GUI + TUI)
        if: matrix.os_name == 'linux'
        run: cargo build --release --workspace --locked

      - name: Build Release (Windows/macOS GUI)
        if: matrix.os_name != 'linux'
        run: cargo build --release --workspace --locked
        
      - name: Run Tests
        run: cargo test --workspace --locked
        
      - name: Upload Artifact (Linux)
        if: matrix.os_name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: spaceinsight-linux-${{ matrix.arch_label }}
          path: target/release/spaceinsight${{ matrix.exe_suffix }}

      - name: Upload Artifact (Linux TUI)
        if: matrix.os_name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: spaceinsight-tui-linux-${{ matrix.arch_label }}
          path: target/release/spaceinsight-tui${{ matrix.exe_suffix }}
          
      - name: Upload Artifact (Windows)
        if: matrix.os_name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: spaceinsight-windows-${{ matrix.arch_label }}
          path: target/release/spaceinsight${{ matrix.exe_suffix }}
          
      - name: Bundle macOS app
        if: matrix.os_name == 'macos'
        run: |
          ./scripts/bundle-macos.sh
          ditto -c -k --sequesterRsrc --keepParent target/release/SpaceInsight.app target/release/SpaceInsight-macos.zip

      - name: Upload Artifact (macOS)
        if: matrix.os_name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: spaceinsight-macos-${{ matrix.arch_label }}
          path: target/release/SpaceInsight-macos.zip
